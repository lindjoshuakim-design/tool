<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Test Analysis</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .mode-toggle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      margin-bottom: 16px;
    }

    .mode-toggle input {
      display: none;
    }

    .slider {
      position: relative;
      width: 44px;
      height: 24px;
      background-color: #ccc;
      border-radius: 24px;
      transition: background-color 0.25s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: transform 0.25s;
    }

    .mode-toggle input:checked + .slider {
      background-color: #e53935;
    }

    .mode-toggle input#wordModeToggle:checked + .slider {
      background-color: #1976d2;
    }

    .mode-toggle input:checked + .slider::before {
      transform: translateX(20px);
    }

    #textDisplay {
      border: 1px solid #888;
      border-radius: 4px;
      background-color: #f9f9f9;
      padding: 12px;
      margin: 6px 0 14px 0;
      min-height: 70px;
      font-family: monospace;
      font-size: 18px;
      line-height: 1.5;
      color: #666;
    }

    .correct {
      color: #2e7d32;
    }

    .incorrect {
      color: #c62828;
      background-color: #ffcdd2;
      border-radius: 2px;
    }

    .current {
      border-bottom: 2px solid #1976d2;
    }

    textarea {
      width: 100%;
      margin: 6px 0 14px 0;
      padding: 8px;
      font-family: monospace;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <h1>Speed Typing Analysis</h1>

  <div style="display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px;">
    <label class="mode-toggle" style="margin-bottom: 0;">
      <input type="checkbox" id="hardModeToggle">
      <span class="slider"></span>
      <span class="mode-label">Hard Mode (Strict)</span>
    </label>

    <label class="mode-toggle" style="margin-bottom: 0;">
      <input type="checkbox" id="wordModeToggle">
      <span class="slider"></span>
      <span class="mode-label">Random Words Mode</span>
    </label>
  </div>

  <label>Type the following text:</label>
  <div id="textDisplay">Click Start Test to load text...</div>

  <label for="userInput">Your typing:</label><br>
  <textarea id="userInput" cols="50" rows="5" readonly placeholder="Click Start Test to begin..."></textarea><br>

  <button onclick="startTest()">Start Test</button>
  <button onclick="endTest()">End Test</button>

  <div id="output"></div>

  <script src="./speed_analysis.js"></script>
</body>
</html>
